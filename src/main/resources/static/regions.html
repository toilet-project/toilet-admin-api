<!doctype html>
<html lang="ko">
<head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><title>급똥 관리자 | 행정구역 검토</title><link rel="stylesheet" href="/dashboard.css?v=5"/><link rel="stylesheet" href="/regions.css?v=5"/><link rel="stylesheet" href="/admin-shell.css?v=3"/><link rel="stylesheet" href="/admin-session.css?v=1" /></head>
<body class="admin-page region-page">
<main id="loading-shell" class="page-loading" aria-live="polite" hidden><span class="loading-spinner" aria-hidden="true"></span><p>불러오는 중...</p></main>
<main id="auth-shell" class="auth-shell" hidden><section class="login-card"><p class="eyebrow">GEUPDDONG ADMIN</p><h1 id="auth-title">관리자 로그인</h1><p id="auth-description">승인된 관리자 계정으로 로그인해 주세요.</p><div class="login-actions"><a href="https://api.geupddong.com/api/v1/auth/login/google?returnTo=admin">Google로 로그인</a><a class="kakao-login" href="https://api.geupddong.com/api/v1/auth/login/kakao?returnTo=admin">Kakao로 로그인</a></div></section></main>
<main id="region-shell" class="dashboard-shell region-shell" data-admin-page="regions" data-admin-title="행정구역 검토">
  <header class="page-header region-page-header"><div><p class="eyebrow">DATA QUALITY</p><h1>행정구역 검토</h1><p>공공데이터 주소와 좌표 판정을 비교해 서비스에 사용할 시·군·구를 확정합니다.</p></div><a class="secondary-link" href="/">운영 홈으로</a></header>
  <section id="region-workspace" class="panel region-workspace" aria-busy="true">
    <p id="region-status" class="status" role="status"><strong>검토 목록</strong><span>실제 데이터를 불러오는 중입니다.</span></p>
    <div class="region-layout">
      <section class="region-list-pane" aria-label="행정구역 검토 목록">
        <header class="region-list-head"><div><small>REVIEW QUEUE</small><strong>검토할 화장실</strong></div><div class="region-list-tools"><label><select id="region-filter" aria-label="판정 상태"><option value="REVIEW">검토 대상 전체</option><option value="MISMATCH">지역 불일치</option><option value="ADDRESS_UNVERIFIED">주소 검증 불확실</option><option value="REVERSE_FAILED">역조회·코드 충돌</option><option value="NO_COORDINATE">좌표 미입력</option><option value="STALE">변경 후 재판정 대기</option><option value="UNASSESSED">최초 판정 대기</option><option value="VERIFIED">검증 통과</option><option value="ALL">전체</option></select></label><button id="region-refresh" type="button">새로고침</button></div></header>
        <div id="region-list" class="region-list-scroll" aria-live="polite">
          <div class="region-list-skeleton" aria-hidden="true"></div><div class="region-list-skeleton" aria-hidden="true"></div><div class="region-list-skeleton" aria-hidden="true"></div><div class="region-list-skeleton" aria-hidden="true"></div><div class="region-list-skeleton" aria-hidden="true"></div><div class="region-list-skeleton" aria-hidden="true"></div>
        </div>
        <nav id="region-pages" class="report-pagination" aria-label="행정구역 목록 페이지"></nav>
      </section>
      <section id="region-detail" class="region-detail"><p class="empty-state">목록에서 검토할 화장실을 선택해 주세요.</p></section>
    </div>
  </section>
</main>
<script src="/admin-shell.js?v=2"></script><script src="/admin-session.js?v=2"></script><script src="/regions.js?v=6"></script>
</body></html>
