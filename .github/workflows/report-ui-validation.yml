name: Report UI validation

on:
  pull_request:
    paths:
      - 'src/main/resources/static/reports*'
      - 'src/main/resources/static/report-*.js'
      - 'src/main/resources/static/opening-hours*'
      - 'tests/opening-hours-*.test.mjs'
      - 'tests/report-*.test.mjs'
      - '.github/workflows/report-ui-validation.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify report author and address rendering
        run: node --test tests/report-*.test.mjs tests/opening-hours-*.test.mjs
