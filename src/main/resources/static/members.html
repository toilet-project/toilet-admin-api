<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>회원 관리 | 급똥 관리자</title>
  <link rel="stylesheet" href="/dashboard.css?v=5" />
  <link rel="stylesheet" href="/admin-shell.css?v=2" /><link rel="stylesheet" href="/admin-session.css?v=1" />
</head>
<body class="admin-page">
  <main id="loading-shell" class="page-loading" aria-live="polite"><span class="loading-spinner" aria-hidden="true"></span><p>불러오는 중...</p></main>
  <main id="auth-shell" class="auth-shell" hidden><section class="login-card"><p class="eyebrow">GEUPDDONG ADMIN</p><h1 id="auth-title">관리자 로그인</h1><p id="auth-description">승인된 관리자 계정으로 로그인해 주세요.</p><div class="login-actions"><a href="https://api.geupddong.com/api/v1/auth/login/google?returnTo=admin">Google로 로그인</a><a class="kakao-login" href="https://api.geupddong.com/api/v1/auth/login/kakao?returnTo=admin">Kakao로 로그인</a></div></section></main>
  <main id="members-shell" class="dashboard-shell security-shell" data-admin-page="members" data-admin-title="회원 관리" hidden>
    <header class="page-header"><div><p class="eyebrow">MEMBER MANAGEMENT</p><h1>회원 관리</h1><p>가입 회원을 검색하고 계정 상태와 최근 이용 정보를 확인합니다.</p></div><a class="secondary-link" href="/permissions.html">권한 관리로</a></header>
    <section class="panel security-panel">
      <div class="panel-title"><div><h2>회원 목록</h2><p>이름·이메일과 계정 상태를 기준으로 회원을 찾습니다.</p></div></div>
      <div class="security-toolbar"><input id="member-keyword" type="search" placeholder="이름 또는 이메일 검색" autocomplete="off" /><select id="member-status" aria-label="계정 상태"><option value="">전체 상태</option><option value="ACTIVE">활성</option><option value="SUSPENDED">정지</option><option value="WITHDRAWN">탈퇴</option></select><button id="member-refresh" class="secondary-button" type="button">조회</button></div>
      <p id="member-status-text" class="status" role="status">회원을 불러오는 중입니다.</p>
      <div class="table-wrap"><table><thead><tr><th>회원</th><th>이메일</th><th>상태</th><th>역할</th><th>최근 로그인</th></tr></thead><tbody id="member-list"></tbody></table></div>
      <nav id="member-pagination" class="report-pagination" aria-label="회원 페이지 이동"></nav>
    </section>
  </main>
  <script src="/admin-shell.js?v=2"></script><script src="/admin-session.js?v=1"></script><script src="/members.js?v=1"></script>
</body>
</html>
