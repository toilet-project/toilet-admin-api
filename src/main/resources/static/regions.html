<!doctype html>
<html lang="ko">
<head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><title>급똥 관리자 | 행정구역 검토</title><link rel="stylesheet" href="/dashboard.css?v=5"/><link rel="stylesheet" href="/regions.css?v=7"/><link rel="stylesheet" href="/admin-shell.css?v=3"/><link rel="stylesheet" href="/admin-session.css?v=1" /></head>
<body class="admin-page region-page">
<main id="loading-shell" class="page-loading" aria-live="polite" hidden><span class="loading-spinner" aria-hidden="true"></span><p>불러오는 중...</p></main>
<main id="auth-shell" class="auth-shell" hidden><section class="login-card"><p class="eyebrow">GEUPDDONG ADMIN</p><h1 id="auth-title">관리자 로그인</h1><p id="auth-description">승인된 관리자 계정으로 로그인해 주세요.</p><div class="login-actions"><a href="https://api.geupddong.com/api/v1/auth/login/google?returnTo=admin">Google로 로그인</a><a class="kakao-login" href="https://api.geupddong.com/api/v1/auth/login/kakao?returnTo=admin">Kakao로 로그인</a></div></section></main>
<main id="region-shell" class="dashboard-shell region-shell" data-admin-page="regions" data-admin-title="행정구역 검토">
  <header class="page-header region-page-header"><div><p class="eyebrow">DATA QUALITY</p><h1>행정구역 검토</h1><p>공공데이터 주소와 좌표 판정을 비교해 서비스에 사용할 시·군·구를 확정합니다.</p></div><a class="secondary-link" href="/">운영 홈으로</a></header>
  <section id="region-workspace" class="panel region-workspace" aria-busy="true">
    <p id="region-status" class="status" role="status"><strong>검토 목록</strong><span>실제 데이터를 불러오는 중입니다.</span></p>
    <div class="region-layout">
      <section class="region-list-pane" aria-label="행정구역 검토 목록">
        <header class="region-list-head"><div><small>REVIEW QUEUE</small><strong>검토할 화장실</strong></div><div class="region-list-tools"><div class="region-filter-picker"><button id="region-filter-trigger" class="region-filter-trigger" type="button" aria-haspopup="listbox" aria-expanded="false" aria-controls="region-filter-menu"><span id="region-filter-label">검토 대상 전체</span><span class="region-filter-chevron" aria-hidden="true"></span></button><div id="region-filter-menu" class="region-filter-menu" role="listbox" aria-label="판정 상태" hidden><button type="button" role="option" data-filter="REVIEW" aria-selected="true"><span>검토 대상 전체</span><i aria-hidden="true">✓</i></button><button type="button" role="option" data-filter="MISMATCH" aria-selected="false"><span>지역 불일치</span><i aria-hidden="true">✓</i></button><button type="button" role="option" data-filter="ADDRESS_UNVERIFIED" aria-selected="false"><span>주소 검증 불확실</span><i aria-hidden="true">✓</i></button><button type="button" role="option" data-filter="REVERSE_FAILED" aria-selected="false"><span>역조회·코드 충돌</span><i aria-hidden="true">✓</i></button><button type="button" role="option" data-filter="NO_COORDINATE" aria-selected="false"><span>좌표 미입력</span><i aria-hidden="true">✓</i></button><button type="button" role="option" data-filter="STALE" aria-selected="false"><span>변경 후 재판정 대기</span><i aria-hidden="true">✓</i></button><button type="button" role="option" data-filter="UNASSESSED" aria-selected="false"><span>최초 판정 대기</span><i aria-hidden="true">✓</i></button><button type="button" role="option" data-filter="VERIFIED" aria-selected="false"><span>검증 통과</span><i aria-hidden="true">✓</i></button><button type="button" role="option" data-filter="ALL" aria-selected="false"><span>전체</span><i aria-hidden="true">✓</i></button></div></div><button id="region-refresh" type="button">새로고침</button></div></header>
        <div id="region-list" class="region-list-scroll" aria-live="polite">
          <div class="region-list-skeleton" aria-hidden="true"></div><div class="region-list-skeleton" aria-hidden="true"></div><div class="region-list-skeleton" aria-hidden="true"></div><div class="region-list-skeleton" aria-hidden="true"></div><div class="region-list-skeleton" aria-hidden="true"></div><div class="region-list-skeleton" aria-hidden="true"></div>
        </div>
        <nav id="region-pages" class="report-pagination" aria-label="행정구역 목록 페이지"></nav>
      </section>
      <section id="region-detail" class="region-detail"><p class="empty-state">목록에서 검토할 화장실을 선택해 주세요.</p></section>
    </div>
  </section>
</main>
<script src="/admin-shell.js?v=2"></script><script src="/admin-session.js?v=2"></script><script src="/regions.js?v=8"></script>
</body></html>
