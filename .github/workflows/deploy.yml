name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]

permissions:
  contents: read

concurrency:
  group: toilet-admin-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. 소스코드 체크아웃
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. JDK 21 설정
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # 3. Gradle 실행 권한 부여 및 빌드
      - name: Build with Gradle
        run: |
          chmod +x ./gradlew
          ./gradlew clean build -x test

      # 4. Docker Hub 로그인
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 5. Docker 이미지 빌드 및 Push
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/toilet-admin:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/toilet-admin:${{ github.sha }}

      # Deployment commands are unchanged; only the reviewed SSH transport changes.
      - name: Prepare pinned Tunnel SSH transport
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --tlsv1.2 \
            --connect-timeout 10 --max-time 60 \
            https://github.com/cloudflare/cloudflared/releases/download/2026.8.3/cloudflared-linux-amd64.deb \
            -o "$RUNNER_TEMP/cloudflared.deb"
          printf '%s  %s\n' 660b348d473bba81997445b534e7eaefaf4c4e16331866922326c338a7013dd9 "$RUNNER_TEMP/cloudflared.deb" | sha256sum -c -
          dpkg-deb --extract "$RUNNER_TEMP/cloudflared.deb" "$RUNNER_TEMP/cloudflared-package"

      - name: Deploy to Mini PC through Tunnel
        shell: bash
        env:
          TUNNEL_SERVICE_TOKEN_ID: ${{ secrets.TUNNEL_DEPLOY_ACCESS_CLIENT_ID }}
          TUNNEL_SERVICE_TOKEN_SECRET: ${{ secrets.TUNNEL_DEPLOY_ACCESS_CLIENT_SECRET }}
          DEPLOY_SSH_KEY: ${{ secrets.MINI_PC_KEY }}
          TUNNEL_KNOWN_HOSTS: ${{ secrets.TUNNEL_DEPLOY_SSH_KNOWN_HOSTS }}
          TUNNEL_SSH_HOST: ${{ vars.TUNNEL_DEPLOY_SSH_HOST }}
          TUNNEL_SSH_USER: ${{ secrets.MINI_PC_USERNAME }}
          DEPLOY_SCRIPT: |
            set -eu
            umask 077
            trap 'rc=$?; if [ "$rc" -ne 0 ]; then printf "%s\n" "Admin deployment failed. Preserve rollback files; inspect before retrying." >&2; fi; exit "$rc"' EXIT
            command -v flock >/dev/null
            command -v curl >/dev/null
            command -v python3 >/dev/null
            mkdir -p ~/toilet-admin
            cd ~/toilet-admin
            exec 9>.deploy.lock
            flock -n 9

            # Backup before overwriting configuration or pulling/replacing an image.
            rollback_dir=$(mktemp -d "$PWD/rollback-preparation.XXXXXXXX")
            for file in .env docker-compose.yml; do
              if [ -f "$file" ]; then
                cp -- "$file" "$rollback_dir/"
                chmod 600 "$rollback_dir/$file"
              fi
            done
            if docker container inspect toilet-admin >/dev/null 2>&1; then
              previous_image=$(docker container inspect --format '{{.Image}}' toilet-admin)
              docker image inspect "$previous_image" >/dev/null
              printf '%s\n' "$previous_image" > "$rollback_dir/admin-image-id"
              rollback_tag="geupddong-admin-rollback:$(basename "$rollback_dir")"
              docker image tag "$previous_image" "$rollback_tag"
              printf '%s\n' "$rollback_tag" > "$rollback_dir/admin-image-tag"
            fi

            # 관리자 컨테이너는 Docker 네트워크 안에서 MySQL 컨테이너 이름으로 접속한다.
            # 외부/LAN DB 주소 시크릿은 컨테이너 내부에서 접근할 수 없으므로 호스트 부분만 치환한다.
            DB_URL='${{ secrets.SPRING_DB_URL }}'
            DB_PATH_AND_QUERY=$(printf '%s' "$DB_URL" | sed -E 's#^jdbc:mysql://[^/]+/#/#')
            INTERNAL_DB_URL="jdbc:mysql://toilet-mysql${DB_PATH_AND_QUERY}"
            
            # GitHub Secrets 값으로 .env 파일 생성/덮어쓰기
            cat <<EOF > .env
            ADMIN_PORT=${{ secrets.ADMIN_PORT }}
            SPRING_DB_URL=$INTERNAL_DB_URL
            SPRING_DB_USERNAME=${{ secrets.SPRING_DB_USERNAME }}
            SPRING_DB_PASSWORD=${{ secrets.SPRING_DB_PASSWORD }}
            KAKAO_REST_API_KEY=${{ secrets.KAKAO_REST_API_KEY }}
            KAKAO_JAVASCRIPT_KEY=${{ secrets.KAKAO_JAVASCRIPT_KEY }}
            OPERATIONS_API_HEALTH_URL=https://api.geupddong.com/api/health
            EOF

            cat <<EOF > docker-compose.yml
            services:
              toilet-admin:
                image: ${{ secrets.DOCKERHUB_USERNAME }}/toilet-admin:${{ github.sha }}
                container_name: toilet-admin
                restart: unless-stopped
                env_file:
                  - .env
                ports:
                  - "127.0.0.1:${{ secrets.ADMIN_PORT }}:${{ secrets.ADMIN_PORT }}"
                networks:
                  - toilet-network
                logging:
                  driver: json-file
                  options:
                    max-size: "10m"
                    max-file: "5"

            networks:
              toilet-network:
                external: true
            EOF

            docker compose config --quiet
            docker compose pull toilet-admin
            docker compose up -d --wait --wait-timeout 120 toilet-admin
            # Without a container healthcheck, compose --wait only guarantees running.
            # Require the actual application's local health endpoint to report UP.
            attempt=0
            healthy=false
            while [ "$attempt" -lt 30 ]; do
              if health_body=$(curl --fail --silent --max-time 3 "http://127.0.0.1:${{ secrets.ADMIN_PORT }}/actuator/health") &&
                 printf '%s' "$health_body" | python3 -c 'import json,sys; sys.exit(0 if json.load(sys.stdin).get("status") == "UP" else 1)' 2>/dev/null; then
                healthy=true
                break
              fi
              attempt=$((attempt + 1))
              sleep 2
            done
            [ "$healthy" = true ]
            printf '%s\n' 'Admin application health verified. Rollback materials retained.'
            # No pruning and no automatic rollback/retry: other operational changes
            # or a lost SSH connection must be inspected before another deployment.
        run: |
          set -euo pipefail
          umask 077
          : "${TUNNEL_SERVICE_TOKEN_ID:?missing Access ID}"
          : "${TUNNEL_SERVICE_TOKEN_SECRET:?missing Access secret}"
          : "${DEPLOY_SSH_KEY:?missing existing deploy key}"
          : "${TUNNEL_KNOWN_HOSTS:?missing pinned host keys}"
          test "$TUNNEL_SSH_HOST" = 'ssh-deploy.geupddong.com'
          [[ "$TUNNEL_SSH_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$RUNNER_TEMP/tunnel-deploy-key"
          printf '%s\n' "$TUNNEL_KNOWN_HOSTS" > "$RUNNER_TEMP/tunnel-known-hosts"
          printf '%s\n' "$DEPLOY_SCRIPT" > "$RUNNER_TEMP/tunnel-deploy-script"
          ssh-keygen -y -P '' -f "$RUNNER_TEMP/tunnel-deploy-key" >/dev/null
          bash -n "$RUNNER_TEMP/tunnel-deploy-script"
          export PATH="$RUNNER_TEMP/cloudflared-package/usr/bin:$PATH"
          # No automatic retry: a lost connection does not imply the remote deploy stopped.
          timeout 10m ssh -F /dev/null -T -i "$RUNNER_TEMP/tunnel-deploy-key" \
            -o IdentitiesOnly=yes -o BatchMode=yes -o PasswordAuthentication=no \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/tunnel-known-hosts" \
            -o HostKeyAlias=geupddong-mini-pc -o HostKeyAlgorithms=ssh-ed25519 \
            -o ForwardAgent=no -o ClearAllForwardings=yes \
            -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 \
            -o 'ProxyCommand=cloudflared access ssh --hostname %h' \
            "$TUNNEL_SSH_USER@$TUNNEL_SSH_HOST" 'bash -s' < "$RUNNER_TEMP/tunnel-deploy-script"

      - name: Remove ephemeral Tunnel deploy credentials
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -n "${RUNNER_TEMP:?}"
          rm -f -- "$RUNNER_TEMP/tunnel-deploy-key" "$RUNNER_TEMP/tunnel-known-hosts" "$RUNNER_TEMP/tunnel-deploy-script"
