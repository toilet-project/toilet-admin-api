name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]

permissions:
  contents: read

concurrency:
  group: toilet-admin-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. 소스코드 체크아웃
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. JDK 21 설정
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # 3. Gradle 실행 권한 부여 및 빌드
      - name: Build with Gradle
        run: |
          chmod +x ./gradlew
          ./gradlew clean build -x test

      # 4. Docker Hub 로그인
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 5. Docker 이미지 빌드 및 Push
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/toilet-admin:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/toilet-admin:${{ github.sha }}

      - name: Validate protected API usage snapshots
        shell: bash
        env:
          SNAPSHOTS: ${{ secrets.API_USAGE_MANUAL_SNAPSHOTS_BASE64 }}
        run: |
          python3 - <<'PY'
          import base64, json, os
          value = os.environ.get('SNAPSHOTS', '')
          if not value or len(value) > 131072:
              raise SystemExit('Protected API usage snapshots are missing or oversized')
          try:
              decoded = base64.b64decode(value, validate=True)
              payload = json.loads(decoded)
              assert len(decoded) <= 65536
              assert isinstance(payload.get('current'), dict)
              assert isinstance(payload.get('history'), dict)
              assert all(isinstance(item, dict) and 'month' in item for item in payload['current'].values())
          except Exception:
              raise SystemExit('Protected API usage snapshots have an invalid format')
          print('Protected API usage snapshots validated without revealing values')
          PY

      # Deployment commands are unchanged; only the reviewed SSH transport changes.
      - name: Prepare pinned Tunnel SSH transport
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --tlsv1.2 \
            --connect-timeout 10 --max-time 60 \
            https://github.com/cloudflare/cloudflared/releases/download/2026.8.3/cloudflared-linux-amd64.deb \
            -o "$RUNNER_TEMP/cloudflared.deb"
          printf '%s  %s\n' 660b348d473bba81997445b534e7eaefaf4c4e16331866922326c338a7013dd9 "$RUNNER_TEMP/cloudflared.deb" | sha256sum -c -
          dpkg-deb --extract "$RUNNER_TEMP/cloudflared.deb" "$RUNNER_TEMP/cloudflared-package"

      - name: Deploy to Mini PC through Tunnel
        shell: bash
        env:
          TUNNEL_SERVICE_TOKEN_ID: ${{ secrets.TUNNEL_DEPLOY_ACCESS_CLIENT_ID }}
          TUNNEL_SERVICE_TOKEN_SECRET: ${{ secrets.TUNNEL_DEPLOY_ACCESS_CLIENT_SECRET }}
          DEPLOY_SSH_KEY: ${{ secrets.MINI_PC_KEY }}
          TUNNEL_KNOWN_HOSTS: ${{ secrets.TUNNEL_DEPLOY_SSH_KNOWN_HOSTS }}
          TUNNEL_SSH_HOST: ${{ vars.TUNNEL_DEPLOY_SSH_HOST }}
          TUNNEL_SSH_USER: ${{ secrets.MINI_PC_USERNAME }}
          DEPLOY_SCRIPT: |
            set -eu
            umask 077
            trap 'rc=$?; if [ -n "${candidate_name:-}" ]; then docker rm -f "$candidate_name" >/dev/null 2>&1 || true; fi; if [ "$rc" -ne 0 ] && [ "${preflight_active:-false}" = true ]; then for file in .env docker-compose.yml; do if [ -f "$rollback_dir/$file" ]; then cp -- "$rollback_dir/$file" "$file"; else rm -f -- "$file"; fi; done; fi; if [ "$rc" -ne 0 ]; then printf "%s\n" "Admin deployment failed. Preserve rollback files; inspect before retrying." >&2; fi; exit "$rc"' EXIT
            command -v flock >/dev/null
            command -v curl >/dev/null
            command -v python3 >/dev/null
            mkdir -p ~/toilet-admin
            cd ~/toilet-admin
            exec 9>.deploy.lock
            flock -n 9

            # Backup before overwriting configuration or pulling/replacing an image.
            rollback_dir=$(mktemp -d "$PWD/rollback-preparation.XXXXXXXX")
            for file in .env docker-compose.yml; do
              if [ -f "$file" ]; then
                cp -- "$file" "$rollback_dir/"
                chmod 600 "$rollback_dir/$file"
              fi
            done
            if docker container inspect toilet-admin >/dev/null 2>&1; then
              previous_image=$(docker container inspect --format '{{.Image}}' toilet-admin)
              docker image inspect "$previous_image" >/dev/null
              printf '%s\n' "$previous_image" > "$rollback_dir/admin-image-id"
              rollback_tag="geupddong-admin-rollback:$(basename "$rollback_dir")"
              docker image tag "$previous_image" "$rollback_tag"
              printf '%s\n' "$rollback_tag" > "$rollback_dir/admin-image-tag"
            fi

            # 관리자 컨테이너는 Docker 네트워크 안에서 MySQL 컨테이너 이름으로 접속한다.
            # 외부/LAN DB 주소 시크릿은 컨테이너 내부에서 접근할 수 없으므로 호스트 부분만 치환한다.
            DB_URL='${{ secrets.SPRING_DB_URL }}'
            DB_PATH_AND_QUERY=$(printf '%s' "$DB_URL" | sed -E 's#^jdbc:mysql://[^/]+/#/#')
            INTERNAL_DB_URL="jdbc:mysql://toilet-mysql${DB_PATH_AND_QUERY}"

            rm -f -- ga4-service-account.json
            
            # GitHub Secrets 값으로 .env 파일 생성/덮어쓰기
            cat <<EOF > .env
            ADMIN_PORT=${{ secrets.ADMIN_PORT }}
            SPRING_DB_URL=$INTERNAL_DB_URL
            SPRING_DB_USERNAME=${{ secrets.SPRING_DB_USERNAME }}
            SPRING_DB_PASSWORD=${{ secrets.SPRING_DB_PASSWORD }}
            KAKAO_REST_API_KEY=${{ secrets.KAKAO_REST_API_KEY }}
            KAKAO_JAVASCRIPT_KEY=${{ secrets.KAKAO_JAVASCRIPT_KEY }}
            OPERATIONS_API_HEALTH_URL=https://api.geupddong.com/api/health
            CLOUDFLARE_ANALYTICS_ENABLED=true
            CLOUDFLARE_ACCOUNT_ID=${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
            CLOUDFLARE_ANALYTICS_API_TOKEN=${{ secrets.CLOUDFLARE_ANALYTICS_API_TOKEN }}
            CLOUDFLARE_PLAN_LABEL=Workers Paid
            CLOUDFLARE_BILLING_CYCLE_DAY=29
            CLOUDFLARE_WORKERS_REQUEST_INCLUDED=10000000
            CLOUDFLARE_D1_ROWS_READ_INCLUDED=25000000000
            CLOUDFLARE_R2_STORAGE_BYTE_INCLUDED=10000000000
            CLOUDFLARE_DASHBOARD_URL=https://dash.cloudflare.com/${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
            API_USAGE_GOOGLE_TRANSLATION_PROJECT_ID=${{ vars.API_USAGE_GOOGLE_TRANSLATION_PROJECT_ID }}
            API_USAGE_GOOGLE_PROJECT_ID=${{ vars.API_USAGE_GOOGLE_PROJECT_ID }}
            API_USAGE_GOOGLE_CREDENTIALS_BASE64=${{ secrets.API_USAGE_GOOGLE_CREDENTIALS_BASE64 }}
            API_USAGE_NAVER_CREDENTIALS_BASE64=${{ secrets.API_USAGE_NAVER_CREDENTIALS_BASE64 }}
            API_USAGE_MANUAL_SNAPSHOTS_BASE64=${{ secrets.API_USAGE_MANUAL_SNAPSHOTS_BASE64 }}
            EOF

            # BEGIN OPTIONAL HOST MONITOR CONFIG
            # Optional host summaries only; never expose the SQLite store or Docker socket.
            # Installation and this repository variable are enabled as a separate rollout step.
            if [ '${{ vars.HOST_METRICS_ENABLED }}' = 'true' ]; then
              host_exports=/var/snap/docker/common/geupddong-host-monitor/exports
              [ -d "$host_exports" ]
              [ ! -L "$host_exports" ]
              printf '%s\n' 'HOST_METRICS_DIRECTORY=/var/lib/geupddong-host-metrics' >> .env
            fi
            # END OPTIONAL HOST MONITOR CONFIG

            # BEGIN OPTIONAL ORIGIN BOT CONFIG
            if [ '${{ vars.ORIGIN_BOTS_ENABLED }}' = 'true' ]; then
              bot_exports=/var/snap/docker/common/geupddong-origin-bots/exports
              [ -d "$bot_exports" ]
              [ ! -L "$bot_exports" ]
              printf '%s\n' 'ORIGIN_BOTS_DIRECTORY=/var/lib/geupddong-origin-bots' >> .env
            fi
            # END OPTIONAL ORIGIN BOT CONFIG

            cat <<EOF > docker-compose.yml
            services:
              toilet-admin:
                image: ${{ secrets.DOCKERHUB_USERNAME }}/toilet-admin:${{ github.sha }}
                container_name: toilet-admin
                restart: unless-stopped
                env_file:
                  - .env
                ports:
                  - "127.0.0.1:${{ secrets.ADMIN_PORT }}:${{ secrets.ADMIN_PORT }}"
                networks:
                  - toilet-network
                # HOST_MONITOR_READ_ONLY_VOLUME
                # ORIGIN_BOT_READ_ONLY_VOLUME
                logging:
                  driver: json-file
                  options:
                    max-size: "10m"
                    max-file: "5"

            networks:
              toilet-network:
                external: true
            EOF

            # BEGIN OPTIONAL HOST MONITOR MOUNT
            if [ '${{ vars.HOST_METRICS_ENABLED }}' = 'true' ]; then
              python3 - <<'PY'
            from pathlib import Path
            path = Path('docker-compose.yml')
            text = path.read_text()
            marker = '    # HOST_MONITOR_READ_ONLY_VOLUME'
            assert text.count(marker) == 1
            mount = '    volumes:\n      - type: bind\n        source: /var/snap/docker/common/geupddong-host-monitor/exports\n        target: /var/lib/geupddong-host-metrics\n        read_only: true\n        bind:\n          create_host_path: false'
            path.write_text(text.replace(marker, mount))
            PY
            fi
            # END OPTIONAL HOST MONITOR MOUNT

            # BEGIN OPTIONAL ORIGIN BOT MOUNT
            if [ '${{ vars.ORIGIN_BOTS_ENABLED }}' = 'true' ]; then
              python3 - <<'PY'
            from pathlib import Path
            path = Path('docker-compose.yml')
            text = path.read_text()
            marker = '    # ORIGIN_BOT_READ_ONLY_VOLUME'
            assert text.count(marker) == 1
            mount = '      - type: bind\n        source: /var/snap/docker/common/geupddong-origin-bots/exports\n        target: /var/lib/geupddong-origin-bots\n        read_only: true\n        bind:\n          create_host_path: false'
            if '    volumes:\n' not in text:
                mount = '    volumes:\n' + mount
            path.write_text(text.replace(marker, mount))
            PY
            fi
            # END OPTIONAL ORIGIN BOT MOUNT

            docker compose config --quiet
            docker compose pull toilet-admin
            # Start the exact image with production settings beside the current service.
            # A failed candidate leaves the serving container untouched.
            preflight_active=true
            candidate_name="toilet-admin-preflight-$$"
            candidate_image="${{ secrets.DOCKERHUB_USERNAME }}/toilet-admin:${{ github.sha }}"
            set -- -d --name "$candidate_name" --env-file .env -e ADMIN_PORT=18089 \
              --network toilet-network -p 127.0.0.1::18089
            if [ '${{ vars.HOST_METRICS_ENABLED }}' = 'true' ]; then
              set -- "$@" --mount type=bind,source=/var/snap/docker/common/geupddong-host-monitor/exports,target=/var/lib/geupddong-host-metrics,readonly
            fi
            if [ '${{ vars.ORIGIN_BOTS_ENABLED }}' = 'true' ]; then
              set -- "$@" --mount type=bind,source=/var/snap/docker/common/geupddong-origin-bots/exports,target=/var/lib/geupddong-origin-bots,readonly
            fi
            docker run "$@" "$candidate_image" >/dev/null
            candidate_port=$(docker port "$candidate_name" 18089/tcp | sed -E 's/^.*:([0-9]+)$/\1/')
            case "$candidate_port" in *[!0-9]*|'') printf '%s\n' 'Candidate port unavailable' >&2; exit 1;; esac
            attempt=0
            candidate_healthy=false
            while [ "$attempt" -lt 60 ]; do
              if health_body=$(curl --fail --silent --max-time 3 "http://127.0.0.1:$candidate_port/actuator/health") &&
                 printf '%s' "$health_body" | python3 -c 'import json,sys; sys.exit(0 if json.load(sys.stdin).get("status") == "UP" else 1)' 2>/dev/null; then
                candidate_healthy=true
                break
              fi
              attempt=$((attempt + 1))
              sleep 2
            done
            if [ "$candidate_healthy" != true ]; then
              docker logs --tail 120 "$candidate_name" > "$rollback_dir/candidate-startup.log" 2>&1 || true
              chmod 600 "$rollback_dir/candidate-startup.log"
              printf '%s\n' 'Candidate failed health; startup log saved privately in rollback directory.' >&2
              grep -oE '[A-Za-z0-9_.]+(Exception|Error)' "$rollback_dir/candidate-startup.log" | sort -u | head -20 >&2 || true
              exit 1
            fi
            docker rm -f "$candidate_name" >/dev/null
            candidate_name=
            preflight_active=false
            docker compose up -d --wait --wait-timeout 120 toilet-admin
            # Without a container healthcheck, compose --wait only guarantees running.
            # Require the actual application's local health endpoint to report UP.
            attempt=0
            healthy=false
            while [ "$attempt" -lt 30 ]; do
              if health_body=$(curl --fail --silent --max-time 3 "http://127.0.0.1:${{ secrets.ADMIN_PORT }}/actuator/health") &&
                 printf '%s' "$health_body" | python3 -c 'import json,sys; sys.exit(0 if json.load(sys.stdin).get("status") == "UP" else 1)' 2>/dev/null; then
                healthy=true
                break
              fi
              attempt=$((attempt + 1))
              sleep 2
            done
            [ "$healthy" = true ]
            printf '%s\n' 'Admin application health verified. Rollback materials retained.'
            # No pruning and no automatic rollback/retry: other operational changes
            # or a lost SSH connection must be inspected before another deployment.
        run: |
          set -euo pipefail
          umask 077
          : "${TUNNEL_SERVICE_TOKEN_ID:?missing Access ID}"
          : "${TUNNEL_SERVICE_TOKEN_SECRET:?missing Access secret}"
          : "${DEPLOY_SSH_KEY:?missing existing deploy key}"
          : "${TUNNEL_KNOWN_HOSTS:?missing pinned host keys}"
          test "$TUNNEL_SSH_HOST" = 'ssh-deploy.geupddong.com'
          [[ "$TUNNEL_SSH_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$RUNNER_TEMP/tunnel-deploy-key"
          printf '%s\n' "$TUNNEL_KNOWN_HOSTS" > "$RUNNER_TEMP/tunnel-known-hosts"
          printf '%s\n' "$DEPLOY_SCRIPT" > "$RUNNER_TEMP/tunnel-deploy-script"
          ssh-keygen -y -P '' -f "$RUNNER_TEMP/tunnel-deploy-key" >/dev/null
          bash -n "$RUNNER_TEMP/tunnel-deploy-script"
          export PATH="$RUNNER_TEMP/cloudflared-package/usr/bin:$PATH"
          # No automatic retry: a lost connection does not imply the remote deploy stopped.
          timeout 10m ssh -F /dev/null -T -i "$RUNNER_TEMP/tunnel-deploy-key" \
            -o IdentitiesOnly=yes -o BatchMode=yes -o PasswordAuthentication=no \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/tunnel-known-hosts" \
            -o HostKeyAlias=geupddong-mini-pc -o HostKeyAlgorithms=ssh-ed25519 \
            -o ForwardAgent=no -o ClearAllForwardings=yes \
            -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 \
            -o 'ProxyCommand=cloudflared access ssh --hostname %h' \
            "$TUNNEL_SSH_USER@$TUNNEL_SSH_HOST" 'bash -s' < "$RUNNER_TEMP/tunnel-deploy-script"

      - name: Remove ephemeral Tunnel deploy credentials
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -n "${RUNNER_TEMP:?}"
          rm -f -- "$RUNNER_TEMP/tunnel-deploy-key" "$RUNNER_TEMP/tunnel-known-hosts" "$RUNNER_TEMP/tunnel-deploy-script"
