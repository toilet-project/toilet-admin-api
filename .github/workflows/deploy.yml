name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]

permissions:
  contents: read

concurrency:
  group: toilet-admin-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. 소스코드 체크아웃
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. JDK 21 설정
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # 3. Gradle 실행 권한 부여 및 빌드
      - name: Build with Gradle
        run: |
          chmod +x ./gradlew
          ./gradlew clean build -x test

      # 4. Docker Hub 로그인
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 5. Docker 이미지 빌드 및 Push
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/toilet-admin:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/toilet-admin:${{ github.sha }}

      # 기존 SSH 연결은 유지한다. Tunnel 연결 변경은 별도 검토한다.
      - name: Deploy to Mini PC via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.MINI_PC_HOST }}
          port: ${{ secrets.MINI_PC_PORT }}
          username: ${{ secrets.MINI_PC_USERNAME }}
          key: ${{ secrets.MINI_PC_KEY }}
          script: |
            set -eu
            umask 077
            trap 'rc=$?; if [ "$rc" -ne 0 ]; then printf "%s\n" "Admin deployment failed. Preserve rollback files; inspect before retrying." >&2; fi; exit "$rc"' EXIT
            command -v flock >/dev/null
            command -v curl >/dev/null
            command -v python3 >/dev/null
            mkdir -p ~/toilet-admin
            cd ~/toilet-admin
            exec 9>.deploy.lock
            flock -n 9

            # Backup before overwriting configuration or pulling/replacing an image.
            rollback_dir=$(mktemp -d "$PWD/rollback-preparation.XXXXXXXX")
            for file in .env docker-compose.yml; do
              if [ -f "$file" ]; then
                cp -- "$file" "$rollback_dir/"
                chmod 600 "$rollback_dir/$file"
              fi
            done
            if docker container inspect toilet-admin >/dev/null 2>&1; then
              previous_image=$(docker container inspect --format '{{.Image}}' toilet-admin)
              docker image inspect "$previous_image" >/dev/null
              printf '%s\n' "$previous_image" > "$rollback_dir/admin-image-id"
              rollback_tag="geupddong-admin-rollback:$(basename "$rollback_dir")"
              docker image tag "$previous_image" "$rollback_tag"
              printf '%s\n' "$rollback_tag" > "$rollback_dir/admin-image-tag"
            fi

            # 관리자 컨테이너는 Docker 네트워크 안에서 MySQL 컨테이너 이름으로 접속한다.
            # 외부/LAN DB 주소 시크릿은 컨테이너 내부에서 접근할 수 없으므로 호스트 부분만 치환한다.
            DB_URL='${{ secrets.SPRING_DB_URL }}'
            DB_PATH_AND_QUERY=$(printf '%s' "$DB_URL" | sed -E 's#^jdbc:mysql://[^/]+/#/#')
            INTERNAL_DB_URL="jdbc:mysql://toilet-mysql${DB_PATH_AND_QUERY}"
            
            # GitHub Secrets 값으로 .env 파일 생성/덮어쓰기
            cat <<EOF > .env
            ADMIN_PORT=${{ secrets.ADMIN_PORT }}
            SPRING_DB_URL=$INTERNAL_DB_URL
            SPRING_DB_USERNAME=${{ secrets.SPRING_DB_USERNAME }}
            SPRING_DB_PASSWORD=${{ secrets.SPRING_DB_PASSWORD }}
            KAKAO_REST_API_KEY=${{ secrets.KAKAO_REST_API_KEY }}
            KAKAO_JAVASCRIPT_KEY=${{ secrets.KAKAO_JAVASCRIPT_KEY }}
            OPERATIONS_API_HEALTH_URL=https://api.geupddong.com/api/health
            EOF

            cat <<EOF > docker-compose.yml
            services:
              toilet-admin:
                image: ${{ secrets.DOCKERHUB_USERNAME }}/toilet-admin:${{ github.sha }}
                container_name: toilet-admin
                restart: unless-stopped
                env_file:
                  - .env
                ports:
                  - "127.0.0.1:${{ secrets.ADMIN_PORT }}:${{ secrets.ADMIN_PORT }}"
                networks:
                  - toilet-network
                logging:
                  driver: json-file
                  options:
                    max-size: "10m"
                    max-file: "5"

            networks:
              toilet-network:
                external: true
            EOF

            docker compose config --quiet
            docker compose pull toilet-admin
            docker compose up -d --wait --wait-timeout 120 toilet-admin
            # Without a container healthcheck, compose --wait only guarantees running.
            # Require the actual application's local health endpoint to report UP.
            attempt=0
            healthy=false
            while [ "$attempt" -lt 30 ]; do
              if health_body=$(curl --fail --silent --max-time 3 "http://127.0.0.1:${{ secrets.ADMIN_PORT }}/actuator/health") &&
                 printf '%s' "$health_body" | python3 -c 'import json,sys; sys.exit(0 if json.load(sys.stdin).get("status") == "UP" else 1)' 2>/dev/null; then
                healthy=true
                break
              fi
              attempt=$((attempt + 1))
              sleep 2
            done
            [ "$healthy" = true ]
            printf '%s\n' 'Admin application health verified. Rollback materials retained.'
            # No pruning and no automatic rollback/retry: other operational changes
            # or a lost SSH connection must be inspected before another deployment.
