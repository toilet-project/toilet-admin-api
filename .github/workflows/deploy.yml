name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. 소스코드 체크아웃
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. JDK 21 설정
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # 3. Gradle 실행 권한 부여 및 빌드
      - name: Build with Gradle
        run: |
          chmod +x ./gradlew
          ./gradlew clean build -x test

      # 4. Docker Hub 로그인
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 5. Docker 이미지 빌드 및 Push
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/toilet-admin:latest

      # 6. 미니 PC에 SSH 접속하여 배포 실행 (.env 자동 생성 및 Prune 옵션 변경)
      - name: Deploy to Mini PC via SSH Password
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.MINI_PC_HOST }}
          port: ${{ secrets.MINI_PC_PORT }}
          username: ${{ secrets.MINI_PC_USERNAME }}
          key: ${{ secrets.MINI_PC_KEY }}
          script: |
            mkdir -p ~/toilet-admin
            cd ~/toilet-admin

            # 관리자 컨테이너는 Docker 네트워크 안에서 MySQL 컨테이너 이름으로 접속한다.
            # 외부/LAN DB 주소 시크릿은 컨테이너 내부에서 접근할 수 없으므로 호스트 부분만 치환한다.
            DB_URL='${{ secrets.SPRING_DB_URL }}'
            DB_PATH_AND_QUERY=$(printf '%s' "$DB_URL" | sed -E 's#^jdbc:mysql://[^/]+/#/#')
            INTERNAL_DB_URL="jdbc:mysql://toilet-mysql${DB_PATH_AND_QUERY}"
            
            # GitHub Secrets 값으로 .env 파일 생성/덮어쓰기
            cat <<EOF > .env
            ADMIN_PORT=${{ secrets.ADMIN_PORT }}
            SPRING_DB_URL=$INTERNAL_DB_URL
            SPRING_DB_USERNAME=${{ secrets.SPRING_DB_USERNAME }}
            SPRING_DB_PASSWORD=${{ secrets.SPRING_DB_PASSWORD }}
            KAKAO_REST_API_KEY=${{ secrets.KAKAO_REST_API_KEY }}
            EOF
            
            docker compose pull
            docker compose up -d --build
            docker image prune -af --filter "until=24h"
