<!doctype html>
<html lang="ko">
<head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>급똥 관리자 | 배치 실행 이력</title><link rel="stylesheet" href="/dashboard.css" /></head>
<body>
  <main id="loading-shell" class="auth-shell"><section class="login-card loading-card"><p class="eyebrow">GEUPDDONG ADMIN</p><h1>관리자 확인 중</h1><p>로그인 상태를 안전하게 확인하고 있습니다.</p></section></main>
  <main id="auth-shell" class="auth-shell" hidden><section class="login-card"><p class="eyebrow">GEUPDDONG ADMIN</p><h1 id="auth-title">관리자 로그인</h1><p id="auth-description">승인된 관리자 계정으로 로그인해 주세요.</p><div id="auth-actions" class="login-actions"><a href="https://api.geupddong.com/api/v1/auth/login/google?returnTo=admin">Google로 로그인</a><a class="kakao-login" href="https://api.geupddong.com/api/v1/auth/login/kakao?returnTo=admin">Kakao로 로그인</a></div></section></main>
  <main id="batch-shell" class="dashboard-shell" hidden>
    <header class="page-header review-page-header"><div><p class="eyebrow">GEUPDDONG ADMIN</p><h1>배치 실행 이력</h1><p>공공데이터 동기화 결과와 실패 사유를 기간·상태별로 확인합니다.</p></div><a class="secondary-link" href="/">운영 현황으로</a></header>
    <section class="panel"><div class="history-toolbar"><label>기간 <input id="from" type="date" /> <span>~</span> <input id="to" type="date" /></label><select id="batch-status" aria-label="배치 상태"><option value="">전체 상태</option><option value="SUCCESS">성공</option><option value="FAILED">실패</option></select><select id="batch-sort" aria-label="정렬 순서"><option value="NEWEST">최신 실행 순</option><option value="OLDEST">오래된 실행 순</option></select><button id="refresh" type="button">조회</button></div><p id="history-status" class="status" role="status">실행 이력을 불러오는 중입니다.</p><div class="table-wrap"><table><thead><tr><th>완료 시각</th><th>유형</th><th>상태</th><th>조회 기간</th><th>요청</th><th>수신</th><th>신규</th><th>수정</th><th>실패 사유</th></tr></thead><tbody id="history"></tbody></table></div><nav id="history-pagination" class="report-pagination" aria-label="배치 실행 이력 페이지 이동"></nav></section>
  </main><script src="/batch-syncs.js"></script>
</body></html>
