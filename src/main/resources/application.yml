
server:
  port: ${ADMIN_PORT}

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  # 1. 데이터베이스 연동 설정
  datasource:
    url: ${SPRING_DB_URL}
    username: ${SPRING_DB_USERNAME}
    password: ${SPRING_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      data-source-properties:
        connectionTimeZone: Asia/Seoul

  # 2. JPA 설정
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

kakao:
  rest-api-key: ${KAKAO_REST_API_KEY:}
  javascript-key: ${KAKAO_JAVASCRIPT_KEY:}

operations:
  api-health-url: ${OPERATIONS_API_HEALTH_URL:https://api.geupddong.com/api/health}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
  metrics:
    tags:
      application: toilet-admin
    distribution:
      percentiles-histogram:
        http.server.requests: true
      slo:
        http.server.requests: 100ms,250ms,500ms,1s,2s
