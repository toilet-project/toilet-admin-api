name: Analytics validation
on:
  pull_request:
    paths:
      - 'src/**/analytics/**'
      - 'src/main/resources/static/*analytics*'
      - 'src/main/resources/static/origin-bots.js'
      - 'tests/*analytics*'
      - 'preview/analytics-gateway.mjs'
      - 'operations/origin-bots/**'
      - '.github/workflows/analytics-validation.yml'
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  analytics:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify aggregate queries, bot filtering and legacy compatibility
        run: |
          chmod +x gradlew
          ./gradlew test --tests '*analytics*' --no-daemon --max-workers=1
          node --test tests/service-analytics-ui.test.mjs tests/analytics-preview-gateway.test.mjs
          python3 -B -m unittest discover -s operations/origin-bots -p 'test*.py'
