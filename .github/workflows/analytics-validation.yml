name: Analytics validation
on:
  pull_request:
    paths:
      - 'src/**/analytics/**'
      - 'src/main/resources/static/*analytics*'
      - 'src/main/resources/static/origin-bots.js'
      - 'src/main/resources/static/written-reviews*'
      - 'tests/*analytics*'
      - 'tests/written-reviews*'
      - 'preview/analytics-gateway.mjs'
      - 'preview/*written-reviews*'
      - 'operations/origin-bots/**'
      - '.github/workflows/analytics-validation.yml'
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  analytics:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify aggregate queries, bot filtering and legacy compatibility
        run: |
          chmod +x gradlew
          ./gradlew test --tests '*analytics*' --no-daemon --max-workers=1
          node --test tests/service-analytics-ui.test.mjs tests/analytics-preview-gateway.test.mjs tests/written-reviews*.test.mjs
          python3 -B -m unittest discover -s operations/origin-bots -p 'test*.py'
      - name: Install isolated browser test runtime
        run: |
          npm install --prefix "$RUNNER_TEMP/review-browser" --ignore-scripts --no-audit --no-fund --package-lock=false playwright@1.62.1
          node "$RUNNER_TEMP/review-browser/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Verify written reviews on desktop and mobile
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/review-browser/node_modules/playwright
          PLAYWRIGHT_CHANNEL: chromium
        run: node tests/written-reviews-browser.cjs
