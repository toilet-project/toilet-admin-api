name: Duplicate facility validation
on:
  pull_request:
    paths: ['src/**', 'tests/**', 'preview/duplicate-gateway.mjs', '.github/workflows/duplicate-facility-validation.yml']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test tests/*.test.mjs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: chmod +x gradlew && ./gradlew test bootJar --no-daemon --console=plain
