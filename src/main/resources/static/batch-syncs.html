<!doctype html>
<html lang="ko">
<head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>급똥 관리자 | 배치 실행 이력</title><link rel="stylesheet" href="/dashboard.css?v=5" /><link rel="stylesheet" href="/admin-shell.css?v=6" /><link rel="stylesheet" href="/admin-session.css?v=1" />  <link rel="icon" type="image/svg+xml" href="/brand/hangul-point-v1/favicon.svg" /><link rel="icon" type="image/png" sizes="32x32" href="/brand/hangul-point-v1/favicon-32.png" /><link rel="apple-touch-icon" sizes="180x180" href="/brand/hangul-point-v1/apple-touch-icon.png" /><link rel="stylesheet" href="/brand.css?v=2" />
  <link rel="stylesheet" href="/admin-responsive.css?v=1" />
</head>
<body class="admin-page">
  <main id="loading-shell" class="page-loading" hidden aria-live="polite"><span class="loading-spinner" aria-hidden="true"></span><p>불러오는 중...</p></main>
  <main id="auth-shell" class="auth-shell" hidden><section class="login-card"><img class="admin-login-brand" src="/brand/hangul-point-v1/lockup-ko.svg" alt="급똥" width="646" height="232" /><p class="eyebrow">GEUPDDONG ADMIN</p><h1 id="auth-title">관리자 로그인</h1><p id="auth-description">승인된 관리자 계정으로 로그인해 주세요.</p><div id="auth-actions" class="login-actions"><a href="https://api.geupddong.com/api/v1/auth/login/google?returnTo=admin">Google로 로그인</a><a class="kakao-login" href="https://api.geupddong.com/api/v1/auth/login/kakao?returnTo=admin">Kakao로 로그인</a></div></section></main>
  <main id="batch-shell" class="dashboard-shell" data-admin-page="history" data-admin-title="배치 실행 이력">
    <header class="page-header review-page-header"><div><p class="eyebrow">OPERATION HISTORY</p><h1>배치 실행 이력</h1><p>공공데이터 동기화 결과와 실패 사유를 기간·상태별로 확인합니다.</p></div><a class="secondary-link" href="/operations.html">서비스 상태로</a></header>
    <section class="panel"><div class="history-toolbar"><label>기간 <input id="from" type="date" /> <span>~</span> <input id="to" type="date" /></label><select id="batch-status" aria-label="배치 상태"><option value="">전체 상태</option><option value="SUCCESS">성공</option><option value="FAILED">실패</option></select><select id="batch-sort" aria-label="정렬 순서"><option value="NEWEST">최신 실행 순</option><option value="OLDEST">오래된 실행 순</option></select><button id="refresh" type="button">조회</button></div><p id="history-status" class="status" role="status">실행 이력을 불러오는 중입니다.</p><div class="table-wrap"><table><thead><tr><th>완료 시각</th><th>유형</th><th>상태</th><th>조회 기간</th><th>요청</th><th>수신</th><th>신규</th><th>수정</th><th>실패 사유</th></tr></thead><tbody id="history"></tbody></table></div><nav id="history-pagination" class="report-pagination" aria-label="배치 실행 이력 페이지 이동"></nav></section>
  </main><script src="/admin-shell.js?v=12"></script><script src="/admin-responsive.js?v=1"></script><script src="/admin-session.js?v=2"></script><script src="/batch-syncs.js?v=2"></script>
</body></html>
