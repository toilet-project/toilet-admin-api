
server:
  port: ${ADMIN_PORT}

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  jackson:
    time-zone: Asia/Seoul
  # 1. 데이터베이스 연동 설정
  datasource:
    url: ${SPRING_DB_URL}
    username: ${SPRING_DB_USERNAME}
    password: ${SPRING_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      data-source-properties:
        connectionTimeZone: Asia/Seoul

  # 2. JPA 설정
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
        jdbc:
          time_zone: Asia/Seoul

kakao:
  rest-api-key: ${KAKAO_REST_API_KEY:}
  javascript-key: ${KAKAO_JAVASCRIPT_KEY:}

operations:
  api-health-url: ${OPERATIONS_API_HEALTH_URL:https://api.geupddong.com/api/health}

cloudflare:
  analytics:
    enabled: ${CLOUDFLARE_ANALYTICS_ENABLED:false}
    endpoint: ${CLOUDFLARE_ANALYTICS_ENDPOINT:https://api.cloudflare.com/client/v4/graphql}
    account-id: ${CLOUDFLARE_ACCOUNT_ID:}
    api-token: ${CLOUDFLARE_ANALYTICS_API_TOKEN:}
    cache-seconds: ${CLOUDFLARE_ANALYTICS_CACHE_SECONDS:300}
    workers-daily-limit: ${CLOUDFLARE_WORKERS_DAILY_LIMIT:100000}
    d1-rows-read-daily-limit: ${CLOUDFLARE_D1_ROWS_READ_DAILY_LIMIT:5000000}
    r2-storage-byte-limit: ${CLOUDFLARE_R2_STORAGE_BYTE_LIMIT:10737418240}
    dashboard-url: ${CLOUDFLARE_DASHBOARD_URL:https://dash.cloudflare.com/}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
  metrics:
    tags:
      application: toilet-admin
    distribution:
      percentiles-histogram:
        http.server.requests: true
      slo:
        http.server.requests: 100ms,250ms,500ms,1s,2s
