<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>서비스 이용 분석 | 급똥 관리자</title>
    <link rel="stylesheet" href="/dashboard.css?v=5" />
    <link rel="stylesheet" href="/admin-shell.css?v=4" />
    <link rel="stylesheet" href="/admin-session.css?v=1" />
    <link rel="stylesheet" href="/service-analytics.css?v=4" />
  </head>
  <body class="admin-page analytics-page">
    <main id="loading-shell" class="page-loading" hidden>
      <span class="loading-spinner"></span>
      <p>불러오는 중...</p>
    </main>
    <main id="auth-shell" class="auth-shell" hidden>
      <section class="login-card">
        <p class="eyebrow">GEUPDDONG ADMIN</p>
        <h1 id="auth-title">관리자 로그인</h1>
        <p id="auth-description">승인된 관리자 계정으로 로그인해 주세요.</p>
        <div class="login-actions">
          <a
            href="https://api.geupddong.com/api/v1/auth/login/google?returnTo=admin"
            >Google로 로그인</a
          ><a
            class="kakao-login"
            href="https://api.geupddong.com/api/v1/auth/login/kakao?returnTo=admin"
            >Kakao로 로그인</a
          >
        </div>
      </section>
    </main>
    <main
      id="analytics-shell"
      class="dashboard-shell analytics-shell"
      data-admin-page="analytics"
      data-admin-title="서비스 이용 분석"
    >
      <header class="page-header analytics-page-header">
        <div>
          <p class="eyebrow">SERVICE INSIGHTS</p>
          <h1>서비스 이용 분석</h1>
          <p>방문의 변화부터 실제 이용 행동까지, 원인을 좁혀 확인합니다.</p>
        </div>
        <div class="analytics-header-actions">
          <button id="analytics-export" type="button" disabled>
            CSV 내보내기</button
          ><button
            id="analytics-refresh"
            type="button"
            class="analytics-primary-button"
          >
            새로고침
          </button>
        </div>
      </header>
      <section class="analytics-controls" aria-label="분석 조건">
        <div class="analytics-control-line">
          <div class="analytics-periods" role="group" aria-label="조회 기간">
            <button type="button" data-range="today">오늘</button
            ><button type="button" data-range="yesterday">어제</button
            ><button type="button" data-range="7d" aria-pressed="true">
              최근 7일</button
            ><button type="button" data-range="30d">최근 30일</button
            ><button type="button" data-range="custom">직접 선택</button>
          </div>
          <div class="analytics-control-actions">
          <span id="analytics-updated-at" class="analytics-muted"
            >연결 확인 중</span
          >
          <button id="analytics-exclude-bots" class="analytics-bot-toggle" type="button"
            role="switch" aria-checked="true" aria-describedby="analytics-bot-note" disabled>
            <span>봇 제외</span><span class="analytics-switch-track" aria-hidden="true"></span>
          </button>
          </div>
        </div>
        <form id="analytics-custom-range" class="analytics-custom-range" hidden>
          <label>시작일<input id="analytics-from" type="date" required /></label
          ><span>~</span
          ><label>종료일<input id="analytics-to" type="date" required /></label
          ><button type="submit">조회</button>
        </form>
        <div class="analytics-filter-line">
          <label
            >기기<select id="filter-device">
              <option value="">모든 기기</option>
              <option value="mobile">모바일</option>
              <option value="desktop">데스크톱</option>
              <option value="tablet">태블릿</option>
            </select></label
          ><label
            >유입 소스<select id="filter-source">
              <option value="">전체 유입</option>
            </select></label
          ><label
            >방문한 페이지<select id="filter-page">
              <option value="">전체 페이지</option>
            </select></label
          ><label
            >접속 국가<select id="filter-country">
              <option value="">모든 국가</option>
            </select></label
          ><button id="analytics-reset" type="button">필터 초기화</button>
        </div>
        <div
          id="analytics-filter-chips"
          class="analytics-chips"
          aria-live="polite"
        ></div>
        <p id="analytics-bot-note" class="analytics-bot-note" aria-live="polite"></p>
      </section>
      <div
        id="analytics-error"
        class="analytics-error"
        role="alert"
        hidden
      ></div>
      <div
        id="analytics-range-note"
        class="analytics-range-note"
        aria-live="polite"
      ></div>
      <nav class="analytics-tabs" aria-label="분석 영역">
        <button type="button" data-tab="overview" aria-current="page">
          요약</button
        ><button type="button" data-tab="acquisition">유입 경로</button
        ><button type="button" data-tab="content">페이지·화면</button
        ><button type="button" data-tab="behavior">이용 행동</button
        ><button type="button" data-tab="audience">방문 환경</button
        ><button type="button" data-tab="quality">수집 상태</button
        ><button type="button" data-tab="bots">봇 접근</button>
      </nav>
      <section
        id="analytics-kpis"
        class="analytics-kpi-grid"
        aria-label="핵심 지표"
      ></section>
      <div id="analytics-view" aria-busy="true">
        <p class="analytics-empty">이용 데이터를 불러오고 있습니다.</p>
      </div>
      <details class="analytics-definitions">
        <summary>지표를 읽는 기준</summary>
        <ul id="analytics-definitions-list"></ul>
        <p>
          현재 필터와 기간에 해당하는 집계만 표시합니다. 원문 검색어·전체
          URL·화장실 ID·회원 정보는 분석 데이터에 포함되지 않습니다.
        </p>
      </details>
    </main>
    <script src="/admin-shell.js?v=7"></script>
    <script src="/admin-session.js?v=2"></script>
    <script src="/origin-bots.js?v=1"></script>
    <script src="/service-analytics.js?v=4"></script>
  </body>
</html>
