<html lang="ko"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>급똥 관리자 | 배치 실행 이력</title><link rel="stylesheet" href="/dashboard.css" /></head>
